# =========================================================
# SCRIPTS
# =========================================================

script:

  # =======================================================
  # DISPLAY AV
  # =======================================================

  - id: screen_off
    mode: restart

    then:

      - if:
          condition:
            switch.is_on: display_backlight

          then:

            - lvgl.pause:
                show_snow: true

            - delay: 100ms

            - switch.turn_off: display_backlight

            - lambda: |-
                if (!id(ha_was_connected)) {
                  id(ha_offline_active_since) = 0;
                }


  # =======================================================
  # DISPLAY PÅ
  # =======================================================

  - id: screen_on
    mode: restart

    then:

      - if:
          condition:
            switch.is_off: display_backlight

          then:
            - lvgl.resume:

            - script.execute: refresh_ui

            - lvgl.widget.redraw:

            - delay: 100ms

            - switch.turn_on: display_backlight


  # =======================================================
  # HOME ASSISTANT-FORBINDELSE
  # =======================================================

  - id: refresh_connection
    mode: restart

    then:

      - if:
          condition:
            api.connected:
              state_subscription_only: true

          then:

            - if:
                condition:
                  lambda: |-
                    return !id(ha_was_connected);

                then:

                  - lambda: |-
                      const bool first_connection =
                        !id(ha_ever_connected);

                      id(ha_was_connected) = true;
                      id(ha_ever_connected) = true;
                      id(ha_offline_active_since) = 0;

                      // HA-reconnect skal ikke vekke en skjerm
                      // som allerede var av.
                      if (
                        !first_connection &&
                        !id(display_backlight).state
                      ) {
                        id(reconnect_hold_off) = true;
                      }

            - lvgl.label.update:
                id: ha_label
                text: "HA OK"
                text_color: 0xFFFFFF

            - lvgl.widget.update:
                id: ha_pill
                bg_color: 0x207A3C


          else:

            - if:
                condition:
                  lambda: |-
                    return id(ha_was_connected);

                then:

                  - lambda: |-
                      id(ha_was_connected) = false;

                      if (id(display_backlight).state) {
                        id(ha_offline_active_since) =
                          millis();
                      } else {
                        id(ha_offline_active_since) = 0;
                      }

            - lvgl.label.update:
                id: ha_label
                text: "HA --"
                text_color: 0xFFFFFF

            - lvgl.widget.update:
                id: ha_pill
                bg_color: 0x8A1F1F


  # =======================================================
  # AUTOMATISK DISPLAYPOLICY
  # =======================================================

  - id: apply_display_policy
    mode: restart

    then:

      - if:
          condition:
            api.connected:
              state_subscription_only: true

          # =================================================
          # HA TILKOBLET
          # =================================================

          then:

            - lambda: |-
                const uint32_t now = millis();
                const std::string s =
                  id(miele_status).state;

                // Utløpt manuell wake.
                if (
                  id(manual_wake_until) != 0 &&
                  (int32_t)(
                    id(manual_wake_until) - now
                  ) <= 0
                ) {
                  id(manual_wake_until) = 0;
                }

                const bool manual_wake =
                  id(manual_wake_until) != 0 &&
                  (int32_t)(
                    id(manual_wake_until) - now
                  ) > 0;

                const bool finished_active =
                  id(finished_until) != 0 &&
                  (int32_t)(
                    id(finished_until) - now
                  ) > 0;

                const bool idle_active =
                  id(idle_show_until) != 0 &&
                  (int32_t)(
                    id(idle_show_until) - now
                  ) > 0;

                const bool attention_active =
                  id(attention_until) != 0 &&
                  (int32_t)(
                    id(attention_until) - now
                  ) > 0;

                const bool machine_active =
                  s == "in_use" ||
                  s == "pause" ||
                  s == "programmed" ||
                  s == "waiting_to_start";

                bool want = false;

                // Manuell AV.
                if (id(manual_display_off)) {

                  want = false;
                }

                // HA reconnect skal ikke alene vekke.
                else if (id(reconnect_hold_off)) {

                  want = false;
                }

                // Manuell touch-wake.
                else if (manual_wake) {

                  want = true;
                }

                // Aktiv oppvask.
                else if (machine_active) {

                  want = true;
                }

                // Nylig ferdig.
                else if (finished_active) {

                  want = true;
                }

                // Feil/varsel oppstått mens skjermen allerede var på.
                else if (attention_active) {

                  want = true;
                }

                // Kort AV/KLAR-visning.
                else if (idle_active) {

                  want = true;
                }

                id(want_screen_on) = want;


            - if:
                condition:
                  lambda: |-
                    return id(want_screen_on);

                then:
                  - script.execute: screen_on

                else:
                  - script.execute: screen_off


          # =================================================
          # HA NEDE
          # =================================================

          else:

            - lambda: |-
                const uint32_t now = millis();

                bool want = false;

                // En skjerm som allerede var på når HA forsvant,
                // får være på i maksimalt 15 minutter.
                if (id(display_backlight).state) {

                  if (id(ha_offline_active_since) == 0) {

                    id(ha_offline_active_since) = now;
                  }

                  want =
                    (uint32_t)(
                      now - id(ha_offline_active_since)
                    )
                    < 15UL * 60UL * 1000UL;
                }

                // En skjerm som allerede var av skal ikke vekkes
                // fordi HA er nede.
                else {

                  want = false;
                }

                id(want_screen_on) = want;


            - if:
                condition:
                  lambda: |-
                    return id(want_screen_on);

                then:
                  - script.execute: screen_on

                else:
                  - script.execute: screen_off


  # =======================================================
  # UI-OPPDATERING
  # =======================================================

  - id: refresh_ui
    mode: restart

    then:

      # ---------------------------------------------------
      # PROGRAMNAVN
      # ---------------------------------------------------

      - lvgl.label.update:
          id: program_label

          text: !lambda |-
            const std::string p =
              id(miele_program).state;

            if (
              p.empty() ||
              p == "unknown" ||
              p == "unavailable" ||
              p == "no_program"
            ) {
              return std::string("OPPVASKMASKIN");
            }

            if (p == "automatic")
              return std::string("AUTOMATISK");

            if (p == "comfort_wash")
              return std::string("COMFORTWASH");

            if (p == "comfort_wash_plus")
              return std::string("COMFORTWASH+");

            if (p == "eco")
              return std::string("ECO");

            if (p == "extra_quiet")
              return std::string("EKSTRA STILLE");

            if (p == "gentle")
              return std::string("SKÅNSOM");

            if (p == "glasses_warm")
              return std::string("GLASS VARM");

            if (p == "hygiene")
              return std::string("HYGIENE");

            if (p == "intensive")
              return std::string("INTENSIV");

            if (p == "maintenance")
              return std::string("MASKINRENS");

            if (p == "normal")
              return std::string("NORMAL");

            if (p == "pasta_paela")
              return std::string("PASTA / PAELLA");

            if (p == "pot_rests_and_filters")
              return std::string("GRYTERISTER / FILTER");

            if (p == "power_wash")
              return std::string("POWERWASH");

            if (p == "pre_wash")
              return std::string("FORVASK");

            if (p == "quick_intense")
              return std::string("QUICK INTENSE");

            if (p == "quick_power_wash")
              return std::string("QUICKPOWERWASH");

            if (p == "rinse_and_hold")
              return std::string("SKYLL / HOLD");

            if (p == "rinse_salt")
              return std::string("SALT-SKYLLING");

            if (p == "solar_save")
              return std::string("SOLARSAVE");

            if (p == "tall_items")
              return std::string("HØYE GJENSTANDER");

            return p;


      # ---------------------------------------------------
      # HOVEDFELT:
      # TID / AV / KLAR / FERDIG / FEIL
      # ---------------------------------------------------

      - if:
          condition:
            lambda: |-
              const uint32_t now = millis();

              const std::string s =
                id(miele_status).state;

              const bool recently_finished =
                id(finished_until) != 0 &&
                (int32_t)(
                  id(finished_until) - now
                ) > 0;

              return
                s == "off" ||
                s == "idle" ||
                s == "on" ||
                s == "program_ended" ||
                s == "failure" ||
                recently_finished;


          # -----------------------------------------------
          # STOR STATUS
          # -----------------------------------------------

          then:

            - lvgl.widget.hide: remaining_time_label
            - lvgl.widget.show: big_state_label

            - lvgl.label.update:
                id: big_state_label

                text: !lambda |-
                  const uint32_t now = millis();

                  const std::string s =
                    id(miele_status).state;

                  const bool recently_finished =
                    id(finished_until) != 0 &&
                    (int32_t)(
                      id(finished_until) - now
                    ) > 0;

                  if (
                    s == "program_ended" ||
                    recently_finished
                  ) {
                    return std::string("FERDIG");
                  }

                  if (s == "failure") {

                    return std::string("FEIL");
                  }

                  if (s == "off") {

                    return std::string("AV");
                  }

                  if (
                    s == "idle" ||
                    s == "on"
                  ) {
                    return std::string("KLAR");
                  }

                  return std::string("--");


          # -----------------------------------------------
          # RESTTID
          # -----------------------------------------------

          else:

            - lvgl.widget.hide: big_state_label
            - lvgl.widget.show: remaining_time_label

            - lvgl.label.update:
                id: remaining_time_label

                text: !lambda |-
                  const float x =
                    id(miele_remaining).state;

                  if (
                    std::isnan(x) ||
                    x < 0 ||
                    x > 1440
                  ) {
                    return std::string("--:--");
                  }

                  const int mins =
                    (int) std::round(x);

                  char buf[16];

                  snprintf(
                    buf,
                    sizeof(buf),
                    "%d:%02d",
                    mins / 60,
                    mins % 60
                  );

                  return std::string(buf);


      # ---------------------------------------------------
      # PROGRAMFASE
      # ---------------------------------------------------

      - lvgl.label.update:
          id: phase_label

          text: !lambda |-
            const std::string p =
              id(miele_phase).state;

            if (
              p.empty() ||
              p == "unknown" ||
              p == "unavailable" ||
              p == "not_running"
            ) {
              return std::string("");
            }

            if (p == "pre_dishwash")
              return std::string("FORVASK");

            if (p == "main_dishwash")
              return std::string("HOVEDVASK");

            if (p == "interim_rinse")
              return std::string("MELLOMSKYLLING");

            if (p == "final_rinse")
              return std::string("SLUTTSKYLLING");

            if (p == "drying")
              return std::string("TØRKING");

            if (p == "finished")
              return std::string("FERDIG");

            if (p == "reactivating")
              return std::string("REGENERERING");

            if (p == "rinse")
              return std::string("SKYLLING");

            return p;


      # ---------------------------------------------------
      # SPINNER
      # ---------------------------------------------------

      - if:
          condition:
            lambda: |-
              return
                id(miele_status).state == "in_use";

          then:
            - lvgl.widget.show: running_spinner

          else:
            - lvgl.widget.hide: running_spinner


      # ---------------------------------------------------
      # FASE- OG FREMDRIFTSFARGE
      # ---------------------------------------------------

      - if:
          condition:
            lambda: |-
              return
                id(miele_phase).state == "drying";

          then:

            - lvgl.label.update:
                id: phase_label
                text_color: 0xFF9F0A

            - lvgl.bar.update:
                id: progress_bar
                indicator:
                  bg_color: 0xFF9F0A


          else:

            - if:
                condition:
                  lambda: |-
                    const std::string p =
                      id(miele_phase).state;

                    return p == "finished";

                then:

                  - lvgl.label.update:
                      id: phase_label
                      text_color: 0x30D158

                  - lvgl.bar.update:
                      id: progress_bar
                      indicator:
                        bg_color: 0x30D158


                else:

                  - if:
                      condition:
                        lambda: |-
                          const std::string p =
                            id(miele_phase).state;

                          return
                            p == "interim_rinse" ||
                            p == "final_rinse" ||
                            p == "rinse";

                      then:

                        - lvgl.label.update:
                            id: phase_label
                            text_color: 0x00C7BE

                        - lvgl.bar.update:
                            id: progress_bar
                            indicator:
                              bg_color: 0x00C7BE


                      else:

                        - lvgl.label.update:
                            id: phase_label
                            text_color: 0x2F9BFF

                        - lvgl.bar.update:
                            id: progress_bar
                            indicator:
                              bg_color: 0x2F9BFF


      # ---------------------------------------------------
      # FREMDRIFT
      # ---------------------------------------------------

      - lvgl.bar.update:
          id: progress_bar

          value: !lambda |-
            const uint32_t now = millis();

            const std::string s =
              id(miele_status).state;

            const bool recently_finished =
              id(finished_until) != 0 &&
              (int32_t)(
                id(finished_until) - now
              ) > 0;

            if (
              s == "program_ended" ||
              recently_finished
            ) {
              return 100;
            }

            const float elapsed =
              id(miele_elapsed).state;

            const float remaining =
              id(miele_remaining).state;

            if (
              std::isnan(elapsed) ||
              std::isnan(remaining) ||
              elapsed < 0 ||
              remaining < 0
            ) {
              return 0;
            }

            const float total =
              elapsed + remaining;

            if (total <= 0) {

              return 0;
            }

            int pct =
              (int) std::round(
                (elapsed / total) * 100.0f
              );

            if (pct < 0)
              pct = 0;

            if (pct > 100)
              pct = 100;

            return pct;

          animated: true


      - lvgl.label.update:
          id: progress_label

          text: !lambda |-
            const uint32_t now = millis();

            const std::string s =
              id(miele_status).state;

            const bool recently_finished =
              id(finished_until) != 0 &&
              (int32_t)(
                id(finished_until) - now
              ) > 0;

            if (
              s == "program_ended" ||
              recently_finished
            ) {
              return std::string(
                "100 %  |  FERDIG"
              );
            }

            const float elapsed =
              id(miele_elapsed).state;

            const float remaining =
              id(miele_remaining).state;

            if (
              std::isnan(elapsed) ||
              std::isnan(remaining) ||
              elapsed < 0 ||
              remaining < 0
            ) {
              return std::string("");
            }

            const float total =
              elapsed + remaining;

            if (total <= 0) {

              return std::string("");
            }

            int pct =
              (int) std::round(
                (elapsed / total) * 100.0f
              );

            if (pct < 0)
              pct = 0;

            if (pct > 100)
              pct = 100;

            const int e =
              (int) std::round(elapsed);

            char buf[80];

            snprintf(
              buf,
              sizeof(buf),
              "%d %%  |  %d:%02d brukt",
              pct,
              e / 60,
              e % 60
            );

            return std::string(buf);


      # ---------------------------------------------------
      # POWERSDISK VERDI
      # ---------------------------------------------------

      - lvgl.label.update:
          id: powerdisk_value

          text: !lambda |-
            const float x =
              id(miele_powerdisk).state;

            if (std::isnan(x)) {

              return std::string("-- %");
            }

            char buf[16];

            snprintf(
              buf,
              sizeof(buf),
              "%.0f %%",
              x
            );

            return std::string(buf);


      - lvgl.bar.update:
          id: powerdisk_bar

          value: !lambda |-
            const float x =
              id(miele_powerdisk).state;

            if (std::isnan(x))
              return 0;

            if (x <= 0)
              return 0;

            if (x >= 100)
              return 100;

            return
              (int) std::round(x);

          animated: true


      # POWERSDISK FARGE

      - if:
          condition:
            lambda: |-
              return
                std::isnan(
                  id(miele_powerdisk).state
                );

          then:

            - lvgl.bar.update:
                id: powerdisk_bar
                indicator:
                  bg_color: 0x596273


          else:

            - if:
                condition:
                  lambda: |-
                    return
                      id(miele_powerdisk).state < 15;

                then:

                  - lvgl.bar.update:
                      id: powerdisk_bar
                      indicator:
                        bg_color: 0xFF453A


                else:

                  - if:
                      condition:
                        lambda: |-
                          return
                            id(miele_powerdisk).state < 30;

                      then:

                        - lvgl.bar.update:
                            id: powerdisk_bar
                            indicator:
                              bg_color: 0xFFD60A


                      else:

                        - lvgl.bar.update:
                            id: powerdisk_bar
                            indicator:
                              bg_color: 0x30D158


      # ---------------------------------------------------
      # GLANSEMIDDEL
      # ---------------------------------------------------

      - lvgl.label.update:
          id: rinseaid_value

          text: !lambda |-
            const float x =
              id(miele_rinseaid).state;

            if (std::isnan(x)) {

              return std::string("-- %");
            }

            char buf[16];

            snprintf(
              buf,
              sizeof(buf),
              "%.0f %%",
              x
            );

            return std::string(buf);


      - lvgl.bar.update:
          id: rinseaid_bar

          value: !lambda |-
            const float x =
              id(miele_rinseaid).state;

            if (std::isnan(x))
              return 0;

            if (x <= 0)
              return 0;

            if (x >= 100)
              return 100;

            return
              (int) std::round(x);

          animated: true


      # GLANSEMIDDEL FARGE

      - if:
          condition:
            lambda: |-
              return
                std::isnan(
                  id(miele_rinseaid).state
                );

          then:

            - lvgl.bar.update:
                id: rinseaid_bar
                indicator:
                  bg_color: 0x596273


          else:

            - if:
                condition:
                  lambda: |-
                    return
                      id(miele_rinseaid).state < 15;

                then:

                  - lvgl.bar.update:
                      id: rinseaid_bar
                      indicator:
                        bg_color: 0xFF453A


                else:

                  - if:
                      condition:
                        lambda: |-
                          return
                            id(miele_rinseaid).state < 30;

                      then:

                        - lvgl.bar.update:
                            id: rinseaid_bar
                            indicator:
                              bg_color: 0xFFD60A


                      else:

                        - lvgl.bar.update:
                            id: rinseaid_bar
                            indicator:
                              bg_color: 0x30D158


      # ---------------------------------------------------
      # FEIL / VARSEL / DØR
      #
      # PRIORITET:
      # FEIL > VARSEL > DØR
      #
      # Ingen av disse vekker displayet.
      # ---------------------------------------------------

      - if:
          condition:
            lambda: |-
              return
                id(miele_problem).state ||
                id(miele_status).state == "failure";

          then:

            - lvgl.label.update:
                id: alert_label
                text: "FEIL PÅ OPPVASKMASKIN"
            - lvgl.widget.update:
                id: alert_banner
                bg_color: 0xA51B1B

            - lvgl.widget.show: alert_banner


          else:

            - if:
                condition:
                  binary_sensor.is_on: miele_warning

                then:

                  - lvgl.label.update:
                      id: alert_label
                      text: "VARSEL FRA OPPVASKMASKIN"

                  - lvgl.widget.update:
                      id: alert_banner
                      bg_color: 0x9A5700

                  - lvgl.widget.show: alert_banner


                else:

                  - if:
                      condition:
                        binary_sensor.is_on: miele_door

                      then:

                        - lvgl.label.update:
                            id: alert_label
                            text: "DØR ÅPEN"

                        - lvgl.widget.update:
                            id: alert_banner
                            bg_color: 0x805600

                        - lvgl.widget.show: alert_banner


                      else:

                        - lvgl.widget.hide: alert_banner


# =========================================================
# PERIODISKE OPPDATERINGER
# =========================================================

interval:

  # Først forbindelsesstatus, deretter skjermpolicy.
  # Viktig ved HA-restart/reconnect.

  - interval: 2s
    then:
      - script.execute: refresh_connection
      - script.execute: apply_display_policy


  # Periodisk grafisk sikkerhetsoppdatering.

  - interval: 30s
    then:
      - script.execute: refresh_ui