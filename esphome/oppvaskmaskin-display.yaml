esphome:
  name: oppvaskmaskin-display
  friendly_name: Oppvaskmaskin display

  on_boot:
    priority: -100
    then:
      # Start mørkt. Reell maskinaktivitet eller touch kan vekke displayet.
      - delay: 750ms

      - lvgl.pause:
          show_snow: true

      - switch.turn_off: display_backlight

      - lambda: |-
          id(ha_offline_active_since) = 0;

      - script.execute: refresh_ui
      - script.execute: refresh_connection
      - script.execute: apply_display_policy


# =========================================================
# ESP32-S3 / NETTVERK
# =========================================================

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

logger:

api:
  reboot_timeout: 0s

ota:
  - platform: esphome


# =========================================================
# WAVESHARE ESP32-S3-TOUCH-LCD-5B
# SKU 28151
# =========================================================

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    scan: false

ch422g:
  - id: ch422g_hub
    i2c_id: bus_a

display:
  - platform: mipi_rgb
    model: WAVESHARE-5-1024X600
    id: lcd
    auto_clear_enabled: false
    update_interval: never


# =========================================================
# BAKLYS
# CH422G EXIO2
# =========================================================

switch:
  - platform: gpio
    id: display_backlight
    internal: true
    restore_mode: ALWAYS_OFF

    pin:
      ch422g: ch422g_hub
      number: 2
      mode:
        output: true
      inverted: false


# =========================================================
# TOUCH
#
# Hele glassflaten brukes bare til manuell skjerm ON/OFF.
# GT911:
#   GPIO4 = interrupt
#   CH422G EXIO1 = reset
# =========================================================

touchscreen:
  - platform: gt911
    id: display_touch
    display: lcd
    i2c_id: bus_a

    interrupt_pin: GPIO4

    reset_pin:
      ch422g: ch422g_hub
      number: 1
      mode:
        output: true
      inverted: false

    on_release:
      then:

        # 1 sekund sperre mot dobbelttrykk/bounce
        - if:
            condition:
              lambda: |-
                const uint32_t now = millis();

                return
                  id(last_touch_toggle) == 0 ||
                  (uint32_t)(now - id(last_touch_toggle)) >= 1000;

            then:

              - lambda: |-
                  id(last_touch_toggle) = millis();

              - if:
                  condition:
                    switch.is_on: display_backlight

                  # ---------------------------------------
                  # MANUELL AV
                  # ---------------------------------------
                  then:

                    - lambda: |-
                        id(manual_display_off) = true;
                        id(manual_wake_until) = 0;

                    - script.execute: screen_off


                  # ---------------------------------------
                  # MANUELL PÅ
                  # ---------------------------------------
                  else:

                    - lambda: |-
                        id(manual_display_off) = false;
                        id(reconnect_hold_off) = false;

                        // Minst 60 sekunder på ved manuell vekking
                        // hvis automatisk policy ellers ville slått av.
                        id(manual_wake_until) =
                          millis() + 60UL * 1000UL;

                        if (!id(ha_was_connected)) {
                          id(ha_offline_active_since) = 0;
                        }

                    - script.execute: screen_on


# =========================================================
# INTERNE TILSTANDER
# =========================================================

globals:

  - id: manual_display_off
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: manual_wake_until
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: last_touch_toggle
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: last_miele_status
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: status_event_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  # FERDIG vises i 15 minutter
  - id: finished_until
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # AV/KLAR vises i 30 sekunder etter faktisk statusendring
  - id: idle_show_until
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Feil/advarsel kan holde en allerede tent skjerm på
  # i inntil 15 minutter, men vekker aldri skjermen.
  - id: attention_until
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # HA-forbindelse
  - id: ha_was_connected
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: ha_ever_connected
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: ha_offline_active_since
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # HA-reconnect skal ikke vekke skjermen hvis den var av
  - id: reconnect_hold_off
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: want_screen_on
    type: bool
    restore_value: no
    initial_value: 'false'


# =========================================================
# FONTER
# =========================================================

font:

  # Stor resttid
  - file:
      type: gfonts
      family: Montserrat
      weight: 700
    id: time_font
    size: 190
    bpp: 4
    glyphsets: []
    glyphs:
      - "0123456789:-"

  # AV / KLAR / FERDIG / FEIL
  - file:
      type: gfonts
      family: Montserrat
      weight: 700
    id: state_font
    size: 130
    bpp: 4
    glyphsets: []
    glyphs:
      - "AVKLRFEDIG-"

  # Valgt program
  - file:
      type: gfonts
      family: Montserrat
      weight: 700
    id: title_font
    size: 44
    bpp: 4
    glyphsets:
      - GF_Latin_Kernel
      - GF_Latin_Core

  # Programfase / overskrifter
  - file:
      type: gfonts
      family: Montserrat
      weight: 600
    id: body_font
    size: 28
    bpp: 4
    glyphsets:
      - GF_Latin_Kernel
      - GF_Latin_Core

  # Nivåtekster
  - file:
      type: gfonts
      family: Montserrat
      weight: 500
    id: small_font
    size: 22
    bpp: 4
    glyphsets:
      - GF_Latin_Kernel
      - GF_Latin_Core

  # HA-status / sekundærtekst
  - file:
      type: gfonts
      family: Montserrat
      weight: 500
    id: tiny_font
    size: 18
    bpp: 4
    glyphsets:
      - GF_Latin_Kernel
      - GF_Latin_Core


# =========================================================
# HOME ASSISTANT - STATUS / PROGRAM / FASE
# =========================================================

text_sensor:

  - platform: homeassistant
    id: miele_status
    entity_id: sensor.oppvaskmaskin

    on_value:
      then:

        - lambda: |-
            const uint32_t now = millis();
            const std::string s = id(miele_status).state;

            id(status_event_pending) = false;

            // Første verdi etter ESPHome-boot:
            // etabler baseline uten å tolke dette som ny hendelse.
            if (id(last_miele_status).empty()) {

              id(last_miele_status) = s;
              id(status_event_pending) = true;

              // Hvis ESPHome faktisk starter mens maskinen kjører,
              // kan skjermen vises.
              if (
                s == "in_use" ||
                s == "pause" ||
                s == "programmed" ||
                s == "waiting_to_start"
              ) {
                id(manual_display_off) = false;
                id(reconnect_hold_off) = false;
              }

              return;
            }

            // Samme status igjen, f.eks. etter HA-restart:
            // ingen ny maskinhendelse.
            if (s == id(last_miele_status)) {
              return;
            }

            id(last_miele_status) = s;
            id(status_event_pending) = true;

            // -------------------------------------------
            // AKTIV / VENTENDE KJØRING
            // -------------------------------------------

            if (
              s == "in_use" ||
              s == "pause" ||
              s == "programmed" ||
              s == "waiting_to_start"
            ) {

              id(finished_until) = 0;
              id(idle_show_until) = 0;
              id(attention_until) = 0;

              // Reell maskinhendelse opphever manuell av.
              id(manual_display_off) = false;
              id(reconnect_hold_off) = false;
              id(manual_wake_until) = 0;
            }

            // -------------------------------------------
            // PROGRAM FERDIG
            // -------------------------------------------

            else if (s == "program_ended") {

              id(finished_until) =
                now + 15UL * 60UL * 1000UL;

              id(idle_show_until) = 0;
              id(attention_until) = 0;

              id(manual_display_off) = false;
              id(reconnect_hold_off) = false;
              id(manual_wake_until) = 0;
            }

            // -------------------------------------------
            // AV / KLAR
            // -------------------------------------------

            else if (
              s == "off" ||
              s == "idle" ||
              s == "on"
            ) {

              id(idle_show_until) =
                now + 30UL * 1000UL;

              id(attention_until) = 0;

              if (!id(manual_display_off)) {
                id(reconnect_hold_off) = false;
              }
            }

            // -------------------------------------------
            // FEIL
            //
            // Feil vekker IKKE skjermen.
            // Hvis skjermen allerede er på, hold den maks 15 min.
            // -------------------------------------------

            else if (s == "failure") {

              if (id(display_backlight).state) {

                id(attention_until) =
                  now + 15UL * 60UL * 1000UL;
              }
            }

        - script.execute: refresh_ui

        - if:
            condition:
              lambda: |-
                return id(status_event_pending);

            then:
              - script.execute: apply_display_policy


  - platform: homeassistant
    id: miele_program
    entity_id: sensor.oppvaskmaskin_program

    on_value:
      then:
        - script.execute: refresh_ui


  - platform: homeassistant
    id: miele_phase
    entity_id: sensor.oppvaskmaskin_programfase

    on_value:
      then:
        - script.execute: refresh_ui


# =========================================================
# HOME ASSISTANT - NUMERISKE VERDIER
# =========================================================

sensor:

  - platform: homeassistant
    id: miele_remaining
    entity_id: sensor.oppvaskmaskin_gjenvaerende_tid

    on_value:
      then:
        - script.execute: refresh_ui


  - platform: homeassistant
    id: miele_elapsed
    entity_id: sensor.oppvaskmaskin_forlopt_tid

    on_value:
      then:
        - script.execute: refresh_ui


  - platform: homeassistant
    id: miele_powerdisk
    entity_id: sensor.oppvaskmaskin_powerdisk_niva

    on_value:
      then:
        - script.execute: refresh_ui


  - platform: homeassistant
    id: miele_rinseaid
    entity_id: sensor.oppvaskmaskin_skyllemiddelniva

    on_value:
      then:
        - script.execute: refresh_ui


# =========================================================
# HOME ASSISTANT - BINÆRE VERDIER
# =========================================================

binary_sensor:

  - platform: homeassistant
    id: miele_door
    entity_id: binary_sensor.oppvaskmaskin_dor

    on_state:
      then:
        # Åpen dør vekker ikke skjermen.
        - script.execute: refresh_ui


  - platform: homeassistant
    id: miele_problem
    entity_id: binary_sensor.oppvaskmaskin_problem

    on_state:
      then:

        - lambda: |-
            const uint32_t now = millis();

            if (id(miele_problem).state) {

              // Bare behold en allerede tent skjerm.
              if (id(display_backlight).state) {

                id(attention_until) =
                  now + 15UL * 60UL * 1000UL;
              }

            } else {

              if (
                !id(miele_warning).state &&
                id(miele_status).state != "failure"
              ) {
                id(attention_until) = 0;
              }
            }

        - script.execute: refresh_ui
        - script.execute: apply_display_policy


  - platform: homeassistant
    id: miele_warning
    entity_id: binary_sensor.oppvaskmaskin_varsel_aktivt

    on_state:
      then:

        - lambda: |-
            const uint32_t now = millis();

            if (id(miele_warning).state) {

              // Varsel vekker heller ikke skjermen.
              if (id(display_backlight).state) {

                id(attention_until) =
                  now + 15UL * 60UL * 1000UL;
              }

            } else {

              if (
                !id(miele_problem).state &&
                id(miele_status).state != "failure"
              ) {
                id(attention_until) = 0;
              }
            }

        - script.execute: refresh_ui
        - script.execute: apply_display_policy


